name: Build Android APK

on:
  workflow_dispatch:        # lets you start a build with a button on the Actions tab
  push:
    branches: [main]        # also builds whenever you upload changes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -o saboteur-app-cloud-build.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

              - name: Accept Android SDK licenses (the SDK is already installed on the runner)
           run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        working-directory: saboteur-app
        run: npm ci

      - name: Create the Android project
        working-directory: saboteur-app
        run: |
          if [ ! -d android ]; then
            npx cap add android
            npx capacitor-assets generate --android
          fi

      - name: Copy the web app into the Android project
        working-directory: saboteur-app
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: saboteur-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the APK so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: saboteur-checkin-debug-apk
          path: saboteur-app/android/app/build/outputs/apk/debug/app-debug.apk
